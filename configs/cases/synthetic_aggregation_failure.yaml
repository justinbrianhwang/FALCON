# A1 aggregation failure (Task T4) — same T11-hardened task family as
# synthetic_reference.yaml (class_separation 0.4, label_noise 0.1), with
# heterogeneity 2.0: all clients hold 100 samples, so "uniform"/"swapped"
# weight modes are no-ops here; the "corrupted" mode (per-client log-uniform
# factors in [10**-intensity, 10**intensity]; T15 added the intensity knob,
# and 1.0 reproduces the original fixed [0.1, 10] range bit-for-bit) only
# bites when client updates genuinely differ, hence the non-IID partition.
# T11 calibration: clients_per_round dropped 5 -> 2 — with 5 clients the
# corrupted weights mostly re-normalize away and the accuracy gap was not
# measurable (+0.002); with 2 clients one corrupted weight dominates the
# mean, so the failure steers the aggregate.
# Measured on this config (intensity 1.0): reference final accuracy 0.824
# vs failure 0.754 (accuracy gap +0.070, loss gap +0.041).
run_id: synthetic_aggregation_failure
seed: 42
rounds: 10
dataset:
  name: synthetic
  num_clients: 10
  num_features: 20
  num_classes: 2
  samples_per_client: 100
  heterogeneity: 2.0
  class_separation: 0.4
  label_noise: 0.1
  minority_class: 1
  minority_client_fraction: 0.2
  seed: 1001
selection:
  clients_per_round: 2
  policy: uniform
local:
  lr: 0.05
  local_steps: 3
  batch_size: 32
compression:
  kind: identity
  parameters: {}
aggregation:
  rule: weighted_mean
  parameters: {}
failure:
  stage: aggregation
  type: wrong_sample_weights
  active_rounds: [2, 9]
  severity: 1
  parameters:
    mode: corrupted
    intensity: 1.0
