# A1 aggregation failure (Task T4) — mirrors synthetic_reference.yaml, with a
# slower local config (lr 0.05, 3 steps) and heterogeneity 2.0: all clients
# hold 100 samples, so "uniform"/"swapped" weight modes are no-ops here; the
# "corrupted" mode (per-client log-uniform factors in [0.1, 10]) only bites
# when client updates genuinely differ, hence the non-IID partition.
run_id: synthetic_aggregation_failure
seed: 42
rounds: 10
dataset:
  name: synthetic
  num_clients: 10
  num_features: 20
  num_classes: 2
  samples_per_client: 100
  heterogeneity: 2.0
  minority_class: 1
  minority_client_fraction: 0.2
  seed: 1001
selection:
  clients_per_round: 5
  policy: uniform
local:
  lr: 0.05
  local_steps: 3
  batch_size: 32
compression:
  kind: identity
  parameters: {}
aggregation:
  rule: weighted_mean
  parameters: {}
failure:
  stage: aggregation
  type: wrong_sample_weights
  active_rounds: [2, 9]
  severity: 1
  parameters:
    mode: corrupted
