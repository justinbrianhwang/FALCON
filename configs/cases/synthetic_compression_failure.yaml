# C1 compression failure (Task T4) — same T11-hardened task family as
# synthetic_reference.yaml (class_separation 0.4, label_noise 0.1), with a
# moderate local config (lr 0.05, 3 steps) so the stripped reference
# converges quickly and the sparsification gap is measured against a stable
# reference. On rounds 2-9 every client update is top-k sparsified to
# ceil(0.05 * 42) = 3 of 42 coordinates by magnitude.
# Measured on this config: reference final accuracy 0.820 vs failure 0.694
# (accuracy gap +0.126, loss gap +0.096).
run_id: synthetic_compression_failure
seed: 42
rounds: 10
dataset:
  name: synthetic
  num_clients: 10
  num_features: 20
  num_classes: 2
  samples_per_client: 100
  heterogeneity: 0.0
  class_separation: 0.4
  label_noise: 0.1
  minority_class: 1
  minority_client_fraction: 0.2
  seed: 1001
selection:
  clients_per_round: 5
  policy: uniform
local:
  lr: 0.05
  local_steps: 3
  batch_size: 32
compression:
  kind: identity
  parameters: {}
aggregation:
  rule: weighted_mean
  parameters: {}
failure:
  stage: compression
  type: aggressive_topk
  active_rounds: [2, 9]
  severity: 1
  parameters:
    k_ratio: 0.05
