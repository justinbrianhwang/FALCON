# S1 selection failure (Task T4) — mirrors synthetic_reference.yaml, with
# minority_class set so the injector has minority-heavy clients to exclude,
# and a slower local config (lr 0.05, 3 steps) so the exclusion window bites
# before convergence. Clients client_7/client_9 carry ~45% of class 1 each
# (global share 0.1) and are dropped from the candidate pool on rounds 2-9.
run_id: synthetic_selection_failure
seed: 42
rounds: 10
dataset:
  name: synthetic
  num_clients: 10
  num_features: 20
  num_classes: 2
  samples_per_client: 100
  heterogeneity: 0.0
  minority_class: 1
  minority_client_fraction: 0.2
  seed: 1001
selection:
  clients_per_round: 5
  policy: uniform
local:
  lr: 0.05
  local_steps: 3
  batch_size: 32
compression:
  kind: identity
  parameters: {}
aggregation:
  rule: weighted_mean
  parameters: {}
failure:
  stage: selection
  type: minority_exclusion
  active_rounds: [2, 9]
  severity: 1
  parameters:
    target_class: 1
    exclusion_probability: 1.0
