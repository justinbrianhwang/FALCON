# S1 selection failure (Task T4) — same T11-hardened task family as
# synthetic_reference.yaml (class_separation 0.4, label_noise 0.1), with
# minority_class set so the injector has minority-heavy clients to exclude,
# and a moderate local config (lr 0.05, 3 steps) so the stripped reference
# converges quickly and the exclusion gap is measured against a stable
# reference. Clients client_7/client_9 carry ~45% of class 1 each (global
# share 0.1) and are dropped from the candidate pool on rounds 2-9.
# Measured on this config: reference final accuracy 0.820 vs failure 0.742
# (accuracy gap +0.078); minority-class accuracy gap +0.165 (primary, S1).
run_id: synthetic_selection_failure
seed: 42
rounds: 10
dataset:
  name: synthetic
  num_clients: 10
  num_features: 20
  num_classes: 2
  samples_per_client: 100
  heterogeneity: 0.0
  class_separation: 0.4
  label_noise: 0.1
  minority_class: 1
  minority_client_fraction: 0.2
  seed: 1001
selection:
  clients_per_round: 5
  policy: uniform
local:
  lr: 0.05
  local_steps: 3
  batch_size: 32
compression:
  kind: identity
  parameters: {}
aggregation:
  rule: weighted_mean
  parameters: {}
failure:
  stage: selection
  type: minority_exclusion
  active_rounds: [2, 9]
  severity: 1
  parameters:
    target_class: 1
    exclusion_probability: 1.0
